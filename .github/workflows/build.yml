# .github/workflows/build.yml
name: Java Manual Build

on:
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Create Output Directory
      run: mkdir -p out

    - name: Compile Java Files
      # This command tells GitHub to look inside your 'src' folder 
      # and compile all .java files it finds there.
      run: |
        javac -d out src/*.java
        
    - name: Status Report
      run: |
        echo "Build success! All files in 'src' compiled correctly."